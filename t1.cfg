[global]
bpm = 120
port = Elektron Digitone

[lfo-1]
frequency = 1/64bpm
shape = sin
phase = 0.5
running = true

[lfo-2]
frequency = 1/64bpm
shape = sin
phase = 0
running = true

[lfo-3]
frequency = 1.3
shape = saw
phase = 0
running = true

[track-1:pattern-1]
scale = aeolian
root = C3
seq-1 = 0*5*lfo1*lfo2
seq-2 = 3
seq-3 = 0*3*lfo1*lfo2 0 3 2
phrase-1 = inf*(2*s1+2*s2)
phrase-3 = inf*s3
velocity-3 = 70+30*lfo3

